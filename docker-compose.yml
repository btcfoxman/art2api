services:
  art2api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-btcfoxman}/${IMAGE_NAME:-art2api}:${IMAGE_TAG:-latest}
    container_name: art2api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: Asia/Taipei
      ART_DATA_DIR: /app/data
      ART_CHROME_EXECUTABLE: /usr/bin/chromium
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    shm_size: "512mb"
    ports:
      - "8797:8797"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8797/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - my-shared-net
networks:
  my-shared-net:
    external: true
