name: Pre-production Docker

on:
  push:
    branches: [pre]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: art2api-pre-production
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: btcfoxman
  IMAGE_NAME: art2api
  IMAGE_REF: ghcr.io/btcfoxman/art2api

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify gateway invariants
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest tests -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:${{ github.sha }}
            ${{ env.IMAGE_REF }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, art2api-pre]
    env:
      DEPLOY_PATH: /home/btcfoxman/docker/art2api
      DEPLOY_SERVICE: art2api
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      ART2API_HOSTNAME: art2api.aiid.edu.kg
      ART2API_ORIGIN: http://127.0.0.1:8797
      CLOUDFLARED_CONFIG: /etc/cloudflared/config.yml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and deploy immutable image
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEPLOY_PATH/.env"
          install -m 644 docker-compose.yml "$DEPLOY_PATH/docker-compose.yml"
          cd "$DEPLOY_PATH"
          env_checksum="$(sha256sum .env | awk '{print $1}')"
          export IMAGE_REGISTRY IMAGE_NAMESPACE IMAGE_NAME IMAGE_TAG
          docker network inspect my-shared-net >/dev/null
          for attempt in 1 2 3; do
            if docker compose pull "$DEPLOY_SERVICE"; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          docker tag "${IMAGE_REF}:${IMAGE_TAG}" "${IMAGE_REF}:latest"
          docker compose up -d "$DEPLOY_SERVICE"
          test "$env_checksum" = "$(sha256sum .env | awk '{print $1}')"
      - name: Verify local service
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8797/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker logs --tail 80 art2api
          exit 1
      - name: Configure and verify cloudflared route
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sudo cat "$CLOUDFLARED_CONFIG" > "$tmp"
          previous="$(sha256sum "$tmp" | awk '{print $1}')"
          CLOUDFLARED_TMP="$tmp" python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path(os.environ['CLOUDFLARED_TMP'])
          lines=path.read_text().splitlines()
          hostname=os.environ['ART2API_HOSTNAME']
          origin=os.environ['ART2API_ORIGIN']
          if not any(line.strip()=='ingress:' for line in lines):
              raise SystemExit('cloudflared ingress section missing')
          matches=[i for i,line in enumerate(lines) if line.strip()==f'- hostname: {hostname}']
          if len(matches)>1: raise SystemExit('duplicate art2api ingress routes')
          if matches:
              start=matches[0]
              end=next((i for i in range(start+1,len(lines)) if lines[i].strip().startswith('- ')),len(lines))
              services=[i for i in range(start+1,end) if lines[i].strip().startswith('service:')]
              if len(services)!=1: raise SystemExit('unexpected existing art2api ingress structure')
              lines[services[0]]='    service: '+origin
          else:
              index=next((i for i,line in enumerate(lines) if line.strip()=='- service: http_status:404'),None)
              if index is None: raise SystemExit('cloudflared catch-all missing')
              lines[index:index]=[f'  - hostname: {hostname}',f'    service: {origin}']
          path.write_text('\n'.join(lines)+'\n')
          PY
          sudo cloudflared tunnel --config "$tmp" ingress validate
          if ! cmp -s "$tmp" <(sudo cat "$CLOUDFLARED_CONFIG"); then
            current="$(sudo cat "$CLOUDFLARED_CONFIG" | sha256sum | awk '{print $1}')"
            test "$current" = "$previous"
            sudo cp "$CLOUDFLARED_CONFIG" "${CLOUDFLARED_CONFIG}.art2api.bak.$(date +%Y%m%d%H%M%S)"
            sudo install -m 600 -o root -g root "$tmp" "$CLOUDFLARED_CONFIG"
            sudo systemctl restart cloudflared
          fi
          tunnel_id="$(sudo awk '/^tunnel:/ {print $2; exit}' "$CLOUDFLARED_CONFIG")"
          test -n "$tunnel_id"
          if [ -f "$HOME/.cloudflared/cert.pem" ]; then
            cloudflared --origincert "$HOME/.cloudflared/cert.pem" tunnel route dns "$tunnel_id" "$ART2API_HOSTNAME"
          else
            sudo cloudflared tunnel route dns "$tunnel_id" "$ART2API_HOSTNAME"
          fi
      - name: Verify public HTTPS and OAuth metadata
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${ART2API_HOSTNAME}/health" >/dev/null && \
               curl -fsS --max-time 10 "https://${ART2API_HOSTNAME}/oauth/client-metadata.json" >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
